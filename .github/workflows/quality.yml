name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  font-qualification:
    name: Portable font qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install content-addressed MoonBit toolchain
        shell: pwsh
        run: ./scripts/ci/Install-PinnedMoonBit.ps1
      - name: Run focused font qualification
        shell: pwsh
        run: ./scripts/quality.ps1 -Lane FontQualification -EvidenceDirectory artifacts/release-qualification/ci-font
      - name: Upload passing font qualification evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: font-qualification-evidence
          path: artifacts/release-qualification/ci-font

  required:
    name: Required quality contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install content-addressed MoonBit toolchain
        shell: pwsh
        run: ./scripts/ci/Install-PinnedMoonBit.ps1
      - name: Verify Required POSIX process containment
        shell: pwsh
        run: ./scripts/quality/Test-RequiredProcessTreeTermination.ps1
      - name: Run required quality lane
        shell: pwsh
        run: ./scripts/quality/Invoke-RequiredBounded.ps1 -EvidenceDirectory artifacts/release-qualification/ci-required -TimeoutSeconds 900
      - name: Upload Required diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-diagnostic
          path: artifacts/release-qualification/ci-required

  llvm-experimental:
    name: LLVM experimental (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install content-addressed MoonBit toolchain
        shell: pwsh
        run: ./scripts/ci/Install-PinnedMoonBit.ps1
      - name: Run isolated LLVM experiment
        shell: pwsh
        run: ./scripts/quality.ps1 -Lane LlvmExperimental
